name: Reusable CI

on:
  workflow_call:
    inputs:
      write_docker_cache:
        description: Allow this trusted workflow run to update the shared BuildKit cache
        required: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "22.13.0"
  APPLICATION_IMAGE: linoy-designs-application:ci
  MIGRATION_IMAGE: linoy-designs-migration:ci

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: linoy_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linoy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/linoy_ci?schema=public
      SEED_ADMIN_PASSWORD: ci-admin-password-not-for-production
      SEED_EMPLOYEE_PASSWORD: ci-employee-password-not-for-production
      SEED_STATION_LATITUDE: "32.0743"
      SEED_STATION_LONGITUDE: "34.7925"
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-longer-than-thirty-two-characters
      JWT_ISSUER: linoy-designs-api
      JWT_AUDIENCE: linoy-designs-app
      APP_ORIGIN: http://127.0.0.1:3001
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test application routes
        run: npm run test:routes

      - name: Test PostgreSQL integration and security
        run: npm run test:postgres

  container-verification:
    name: Container verification
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.APPLICATION_IMAGE }}
          cache-from: type=gha,scope=runtime-amd64
          cache-to: ${{ inputs.write_docker_cache && 'type=gha,mode=max,scope=runtime-amd64' || '' }}

      - name: Build migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migration
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.MIGRATION_IMAGE }}
          cache-from: type=gha,scope=migration-amd64
          cache-to: ${{ inputs.write_docker_cache && 'type=gha,mode=max,scope=migration-amd64' || '' }}

      - name: Smoke test containers
        shell: bash
        run: bash scripts/ci/docker-smoke.sh "${APPLICATION_IMAGE}" "${MIGRATION_IMAGE}"

      - name: Generate application SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.APPLICATION_IMAGE }}
          format: spdx-json
          artifact-name: application-sbom.spdx.json
          output-file: application-sbom.spdx.json
          syft-version: v1.50.0
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate migration SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.MIGRATION_IMAGE }}
          format: spdx-json
          artifact-name: migration-sbom.spdx.json
          output-file: migration-sbom.spdx.json
          syft-version: v1.50.0
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan application image
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.APPLICATION_IMAGE }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          hide-progress: true
          exit-code: "1"
          version: v0.73.0

      - name: Scan migration image
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.MIGRATION_IMAGE }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          hide-progress: true
          exit-code: "1"
          version: v0.73.0

  multiarch-build:
    name: Multi-arch build (${{ matrix.target }})
    needs: container-verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        target:
          - runtime
          - migration
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.target }} for amd64 and arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}-multiarch
          cache-to: ${{ inputs.write_docker_cache && format('type=gha,mode=max,scope={0}-multiarch', matrix.target) || '' }}

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - quality-and-tests
      - container-verification
      - multiarch-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality-and-tests.result }}
          CONTAINER_RESULT: ${{ needs.container-verification.result }}
          MULTIARCH_RESULT: ${{ needs.multiarch-build.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          test "$MULTIARCH_RESULT" = "success"
